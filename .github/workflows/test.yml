name: Test

on:
  push:
    branches: ['ci-debug/**']

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Probe bridge exit (direct spawn)
        shell: bash
        continue-on-error: true
        run: |
          export TRACE_FILE="$RUNNER_TEMP/trace-probe.txt"
          export NODE_OPTIONS="--import=$(node -e 'console.log(require("url").pathToFileURL(process.argv[1]).href)' ci-debug/trace.mjs)"
          for i in 1 2; do echo "== bridge run $i"; node ci-debug/probe.mjs . bridge; done
          echo "== no bridge (-e absent)"; node ci-debug/probe.mjs . none
          cat "$TRACE_FILE"
      - name: Failing test with trace
        shell: bash
        continue-on-error: true
        run: |
          export TRACE_FILE="$RUNNER_TEMP/trace-test.txt"
          export NODE_OPTIONS="--import=$(node -e 'console.log(require("url").pathToFileURL(process.argv[1]).href)' ci-debug/trace.mjs)"
          bunx vitest run tests/durable-worker-e2e.test.ts -t "legacy Pi CLI" || true
          cat "$TRACE_FILE"
